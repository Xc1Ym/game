<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174936" />
    <meta name="description" content="发射水果泡泡，连接三个相同水果并清空果园。" />
    <title>水果泡泡龙｜果园街机厅</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="bubbles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="back-home" href="../../">← 街机厅</a>
        <div class="game-brand">
          <img src="../../assets/fruits/blueberries.png" alt="" />
          <div><p class="eyebrow">FRUIT BUBBLES</p><h1>水果泡泡龙</h1></div>
        </div>
        <button class="header-action" id="pauseButton" type="button" disabled>暂停</button>
      </header>

      <section class="game-toolbar" aria-label="泡泡龙设置">
        <div class="difficulty-group" role="group" aria-label="选择难度">
          <button class="difficulty-button" type="button" data-level="easy">悠闲</button>
          <button class="difficulty-button is-active" type="button" data-level="normal">进阶</button>
          <button class="difficulty-button" type="button" data-level="hard">挑战</button>
        </div>
        <button class="primary-button" id="newGameButton" type="button">开始游戏</button>
      </section>

      <section class="status-strip" aria-label="本局状态">
        <div class="status-box"><span>积分</span><strong id="score">0</strong></div>
        <div class="status-box"><span>连续消除</span><strong id="combo">0</strong></div>
        <div class="status-box"><span>加行倒计时</span><strong id="misses">5</strong></div>
        <div class="status-box"><span>本机最佳</span><strong id="bestScore">0</strong></div>
      </section>

      <section class="game-panel bubble-panel">
        <canvas id="bubbleCanvas" width="640" height="760" aria-label="水果泡泡龙游戏区域"></canvas>
        <div class="result-overlay" id="resultOverlay">
          <div class="result-card">
            <img id="resultImage" src="../../assets/fruits/blueberries.png" alt="" />
            <h2 id="resultTitle">瞄准果串</h2>
            <p id="resultMessage">移动鼠标或手指瞄准，点击发射；三个相同水果连在一起即可消除。</p>
            <button class="primary-button" id="overlayButton" type="button">开始</button>
          </div>
        </div>
      </section>

      <div class="bubble-controls" role="group" aria-label="控制发射方向">
        <button type="button" data-aim="-1" aria-label="向左瞄准">↶</button>
        <button class="shoot-button" type="button" id="shootButton">发射</button>
        <button type="button" data-aim="1" aria-label="向右瞄准">↷</button>
      </div>
      <p class="game-help">移动鼠标或手指瞄准，点击发射；也可使用方向键与空格键。</p>
    </main>
    <script src="bubbles.js"></script>
  </body>
</html>
