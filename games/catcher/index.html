<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#174936" />
    <meta name="description" content="移动果篮接住水果、避开坏果的反应小游戏。" />
    <title>接水果｜果园街机厅</title>
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="catcher.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <a class="back-home" href="../../">← 街机厅</a>
        <div class="game-brand">
          <img src="../../assets/fruits/strawberry.png" alt="" />
          <div><p class="eyebrow">FRUIT CATCHER</p><h1>接水果</h1></div>
        </div>
        <button class="header-action" id="pauseButton" type="button" disabled>暂停</button>
      </header>

      <section class="game-toolbar" aria-label="接水果设置">
        <div class="difficulty-group" role="group" aria-label="选择难度">
          <button class="difficulty-button is-active" type="button" data-level="easy">悠闲</button>
          <button class="difficulty-button" type="button" data-level="normal">进阶</button>
          <button class="difficulty-button" type="button" data-level="hard">挑战</button>
        </div>
        <button class="primary-button" id="newGameButton" type="button">开始游戏</button>
      </section>

      <section class="status-strip" aria-label="本局状态">
        <div class="status-box"><span>积分</span><strong id="score">0</strong></div>
        <div class="status-box"><span>剩余时间</span><strong id="timeLeft">01:00</strong></div>
        <div class="status-box"><span>连续接取</span><strong id="combo">0</strong></div>
        <div class="status-box"><span>本机最佳</span><strong id="bestScore">0</strong></div>
      </section>

      <section class="game-panel catcher-panel">
        <div class="catch-field" id="catchField" aria-label="水果下落区域">
          <div class="orchard-line" aria-hidden="true"></div>
          <div class="catcher" id="catcher"><span>果篮</span></div>
        </div>
        <div class="result-overlay" id="resultOverlay">
          <div class="result-card">
            <img id="resultImage" src="../../assets/fruits/pear.png" alt="" />
            <h2 id="resultTitle">准备接水果</h2>
            <p id="resultMessage">拖动果篮接住好水果，避开带红圈的坏果。</p>
            <button class="primary-button" id="overlayButton" type="button">开始</button>
          </div>
        </div>
      </section>

      <div class="catch-controls" role="group" aria-label="移动果篮">
        <button type="button" data-move="-1" aria-label="向左移动">←</button>
        <span>拖动游戏区域，或使用方向键移动</span>
        <button type="button" data-move="1" aria-label="向右移动">→</button>
      </div>
    </main>
    <script src="catcher.js"></script>
  </body>
</html>
